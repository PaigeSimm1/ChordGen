<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Progression Generator</title>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="Stylesheet.css">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            #loader {
                position: absolute;
                left: 50%;
                top: 50%;
                z-index: 1;
                border: 16px solid #f3f3f3;
                border-top: 16px solid #1fa0f1;
                border-radius: 50%;
                margin: 20px auto;
                width: 150px;
                height: 150px;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
</head>

<body>
        <!--Page Header-->
    <div class="container-fluid py-5 header-container">
        <header class="site-header text-start">
            <h1 class="page-title fw-bold 1h-1 ps-5">Chord Progression Generator</h1>
        </header>
    </div>
<div id="loader"></div>
    <div class="container">
    

    <div id="generating-chord">Generating</div>
    
    </div>

<script src="loading.js"></script>

<script>
    startGeneratingAnim();

    async function generateChords() {
        const savedForm = localStorage.getItem("pendingChordForm");

        if (!savedForm) {
            window.location.replace("/");
            return;
        }

        const saved = JSON.parse(savedForm);
        const formData = new FormData();
        formData.set("style", saved.style);
        formData.set("scale", saved.scale);
        formData.set("time", saved.time);
        formData.set("bpm", saved.bpm);

        try {
            const response = await fetch("/", {
                method: "POST",
                body: formData
            });

            const contentType = response.headers.get("content-type") || "";
            const data = contentType.includes("application/json")
                ? await response.json()
                : null;

            if (!response.ok) {
                const message = data?.errors?.map(error => error.msg).join(" ")
                    || data?.message
                    || `Generation failed with status ${response.status}.`;
                throw new Error(message);
            }

            localStorage.setItem("generatedChords", JSON.stringify(data.progression));
            localStorage.removeItem("pendingChordForm");
            window.location.href = "response.html";
        } catch (error) {
            console.error("Generation failed:", error);
            stopGeneratingAnim();
            document.getElementById("generating-chord").textContent = error.message;
        }
    }

    generateChords();
</script>

    
</body>
</html>
